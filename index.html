<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mon Journal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f0f0f;
      --paper: #1a1a1a;
      --ink: #f0f0f0;
      --muted: #8a8a8a;
      --accent: #ffffff;
      --accent-soft: #c0c0c0;
      --line: #2e2e2e;
      --shadow: rgba(0, 0, 0, 0.55);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Cormorant Garamond', Georgia, serif;
      background:
        radial-gradient(ellipse at 30% 0%, #1c1c1c 0%, transparent 55%),
        radial-gradient(ellipse at 70% 100%, #161616 0%, transparent 50%),
        var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 4rem;
      line-height: 1.65;
    }

    /* ========== COUVERTURE ========== */
    #cover {
      max-width: 400px;
      width: 100%;
      background: var(--paper);
      border-radius: var(--radius);
      box-shadow:
        0 25px 60px var(--shadow),
        0 0 0 1px var(--line),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
      padding: 4rem 2.6rem 3.2rem;
      text-align: center;
      position: relative;
      overflow: hidden;
      animation: fadeIn 0.8s ease;
    }

    #cover::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, #555, #fff, #555);
    }

    #cover::after {
      content: '';
      position: absolute;
      inset: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      pointer-events: none;
    }

    #cover h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.55rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      margin-bottom: 0.35rem;
      color: var(--ink);
      line-height: 1.15;
    }

    #cover .subtitle {
      font-style: italic;
      color: var(--muted);
      font-size: 1.15rem;
      margin-bottom: 2.8rem;
      font-weight: 400;
    }

    #cover .ornament {
      font-size: 1.1rem;
      color: #666;
      margin: 0 0 1.8rem;
      letter-spacing: 0.55em;
      opacity: 0.9;
    }

    #cover p {
      color: var(--muted);
      font-size: 1.05rem;
      margin-bottom: 2.6rem;
      line-height: 1.7;
    }

    .btn {
      display: inline-block;
      background: #fff;
      color: #111;
      border: none;
      padding: 0.95rem 2.4rem;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.15rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.3s, transform 0.25s, box-shadow 0.3s;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
    }

    .btn:hover {
      background: #e8e8e8;
      transform: translateY(-2px);
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.5);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: transparent;
      color: #ddd;
      border: 1.5px solid #444;
      box-shadow: none;
      margin-top: 0.9rem;
    }

    .btn-secondary:hover {
      background: #222;
      border-color: #666;
      box-shadow: none;
    }

    /* ========== JOURNAL ========== */
    #journal {
      display: none;
      max-width: 540px;
      width: 100%;
      animation: fadeIn 0.55s ease;
    }

    .day-header {
      text-align: center;
      margin-bottom: 1.6rem;
    }

    .day-header .weekday {
      font-family: 'Playfair Display', serif;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.28em;
      color: #888;
      margin-bottom: 0.3rem;
      font-weight: 500;
    }

    .day-header .date {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 500;
      color: var(--ink);
      letter-spacing: -0.02em;
    }

    .page {
      background: var(--paper);
      border-radius: var(--radius);
      box-shadow:
        0 20px 50px var(--shadow),
        0 0 0 1px var(--line),
        inset 0 1px 0 rgba(255, 255, 255, 0.03);
      padding: 2.6rem 2.3rem 2.2rem;
      position: relative;
      min-height: 440px;
    }

    .page::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #444, #fff, #444);
      border-radius: var(--radius) var(--radius) 0 0;
    }

    textarea {
      width: 100%;
      min-height: 280px;
      border: none;
      background: transparent;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.25rem;
      line-height: 1.85;
      color: var(--ink);
      resize: vertical;
      outline: none;
      background-image: repeating-linear-gradient(
        transparent,
        transparent 32px,
        #2a2a2a 33px
      );
      background-attachment: local;
      padding: 0.2rem 0 0.5rem;
      margin-bottom: 1rem;
    }

    textarea::placeholder {
      color: #555;
      font-style: italic;
      font-size: 1.15rem;
    }

    .status {
      font-size: 0.9rem;
      color: var(--muted);
      text-align: right;
      min-height: 1.3em;
      transition: color 0.35s, opacity 0.35s;
      letter-spacing: 0.02em;
    }

    .status.saved {
      color: #aaa;
    }

    /* Navigation */
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.7rem;
      gap: 0.8rem;
    }

    .nav-btn {
      background: var(--paper);
      border: 1.5px solid var(--line);
      color: var(--ink);
      padding: 0.75rem 1.35rem;
      border-radius: 999px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.05rem;
      cursor: pointer;
      transition: all 0.25s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .nav-btn:hover:not(:disabled) {
      border-color: #666;
      background: #222;
      box-shadow: 0 4px 16px var(--shadow);
    }

    .nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .day-indicator {
      font-size: 0.95rem;
      color: var(--muted);
      letter-spacing: 0.06em;
    }

    /* ========== VUE MOIS ========== */
    #overview {
      display: none;
      max-width: 640px;
      width: 100%;
      animation: fadeIn 0.55s ease;
    }

    #overview h2 {
      font-family: 'Playfair Display', serif;
      text-align: center;
      font-size: 1.85rem;
      font-weight: 500;
      margin-bottom: 1.8rem;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    .month-nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .month-nav button {
      background: none;
      border: 1px solid var(--line);
      color: var(--ink);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.1rem;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .month-nav button:hover {
      border-color: #666;
      background: #222;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 0.7rem;
    }

    .day-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0.9rem 0.5rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s;
      position: relative;
    }

    .day-card:hover {
      border-color: #666;
      box-shadow: 0 6px 18px var(--shadow);
      transform: translateY(-2px);
      background: #1f1f1f;
    }

    .day-card.today {
      border-color: #888;
      background: #222;
    }

    .day-card.has-memory::after {
      content: '✦';
      position: absolute;
      top: 6px;
      right: 8px;
      color: #ccc;
      font-size: 0.65rem;
    }

    .day-card .num {
      font-family: 'Playfair Display', serif;
      font-size: 1.35rem;
      font-weight: 500;
      color: var(--ink);
    }

    .day-card .wd {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 0.1rem;
    }

    /* ========== SOUVENIRS ========== */
    #souvenirs {
      display: none;
      max-width: 560px;
      width: 100%;
      animation: fadeIn 0.55s ease;
    }

    #souvenirs h2 {
      font-family: 'Playfair Display', serif;
      text-align: center;
      font-size: 1.85rem;
      font-weight: 500;
      margin-bottom: 0.4rem;
      letter-spacing: -0.02em;
    }

    #souvenirs .sub {
      text-align: center;
      color: var(--muted);
      font-size: 1.05rem;
      margin-bottom: 2rem;
      font-style: italic;
    }

    .entry-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .entry-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 1.4rem 1.5rem;
      cursor: pointer;
      transition: all 0.25s;
    }

    .entry-card:hover {
      border-color: #555;
      background: #1f1f1f;
      box-shadow: 0 8px 24px var(--shadow);
      transform: translateY(-2px);
    }

    .entry-card .entry-date {
      font-family: 'Playfair Display', serif;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      color: #aaa;
      margin-bottom: 0.55rem;
      text-transform: capitalize;
    }

    .entry-card .entry-preview {
      font-size: 1.15rem;
      line-height: 1.6;
      color: var(--ink);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 3rem 1rem;
      font-style: italic;
      font-size: 1.15rem;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.4rem;
      width: 100%;
      max-width: 560px;
    }

    .top-bar button {
      background: none;
      border: none;
      color: #bbb;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.05rem;
      cursor: pointer;
      padding: 0.4rem 0.5rem;
      transition: color 0.2s;
    }

    .top-bar button:hover {
      color: #fff;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      #cover { padding: 3rem 1.7rem 2.6rem; }
      #cover h1 { font-size: 2.15rem; }
      .page { padding: 2rem 1.5rem; }
      textarea { min-height: 220px; font-size: 1.15rem; }
    }
  </style>
</head>
<body>

  <!-- ========== COUVERTURE ========== -->
  <section id="cover">
    <div class="ornament">✦ · ✦ · ✦</div>
    <h1>Mon Journal<br></h1>
    <p class="subtitle">Une page · Un jour · Une mémoire</p>
    <p>Écris chaque jour un souvenir, un moment, une émotion.<br>Tes mots restent ici, en sécurité.</p>
    <button class="btn" onclick="ouvrirJournal()">Ouvrir mon journal</button>
    <div>
      <button class="btn btn-secondary" onclick="voirSouvenirs()">Mes souvenirs</button>
    </div>
    <div>
      <button class="btn btn-secondary" onclick="voirVueEnsemble()" style="margin-top:0.7rem;">Voir le mois</button>
    </div>
    <div class="ornament" style="margin-top: 2.8rem; font-size: 0.95rem; letter-spacing: 0.4em;">· · ·</div>
  </section>

  <!-- ========== SOUVENIRS (liste de tout ce qui a été écrit) ========== -->
  <section id="souvenirs">
    <div class="top-bar">
      <button onclick="retourCouverture()">← Couverture</button>
      <button onclick="ouvrirJournal()">Aujourd'hui →</button>
    </div>
    <h2>Mes souvenirs</h2>
    <p class="sub">Relis tes pages pour te rappeler…</p>
    <div class="entry-list" id="entryList"></div>
  </section>

  <!-- ========== VUE D'ENSEMBLE (mois) ========== -->
  <section id="overview">
    <div class="top-bar">
      <button onclick="retourCouverture()">← Couverture</button>
      <button onclick="ouvrirJournal()">Aujourd'hui →</button>
    </div>
    <div class="month-nav">
      <button onclick="changerMois(-1)">←</button>
      <h2 id="monthTitle" style="margin:0;"></h2>
      <button onclick="changerMois(1)">→</button>
    </div>
    <div class="days-grid" id="daysGrid"></div>
  </section>

  <!-- ========== PAGE DU JOUR ========== -->
  <section id="journal">
    <div class="top-bar">
      <button onclick="retourCouverture()">← Couverture</button>
      <button onclick="voirSouvenirs()">Souvenirs</button>
    </div>

    <div class="day-header">
      <div class="weekday" id="weekday"></div>
      <div class="date" id="fullDate"></div>
    </div>

    <div class="page">
      <textarea
        id="memory"
        placeholder="Écris ici ta mémoire du jour…"
        spellcheck="true"
      ></textarea>
      <div class="status" id="status"></div>
    </div>

    <div class="nav">
      <button class="nav-btn" id="prevBtn" onclick="changerJour(-1)">← Précédent</button>
      <span class="day-indicator" id="dayIndicator"></span>
      <button class="nav-btn" id="nextBtn" onclick="changerJour(1)">Suivant →</button>
    </div>
  </section>

  <script>
    const JOURS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
    const JOURS_CAP = ['Dimanche', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'];
    const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin',
                  'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];

    let dateActuelle = new Date();
    dateActuelle.setHours(0, 0, 0, 0);

    let moisVue = new Date(dateActuelle.getFullYear(), dateActuelle.getMonth(), 1);

    function formatKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function estAujourdhui(date) {
      const auj = new Date();
      return date.getFullYear() === auj.getFullYear() &&
             date.getMonth() === auj.getMonth() &&
             date.getDate() === auj.getDate();
    }

    function chargerMemoire(key) {
      return localStorage.getItem('journal_' + key) || '';
    }

    function sauverMemoire(key, texte) {
      if (texte.trim() === '') {
        localStorage.removeItem('journal_' + key);
      } else {
        localStorage.setItem('journal_' + key, texte);
      }
    }

    function afficherJour(date) {
      dateActuelle = new Date(date);
      dateActuelle.setHours(0, 0, 0, 0);

      const key = formatKey(dateActuelle);

      document.getElementById('weekday').textContent = JOURS_CAP[dateActuelle.getDay()];
      document.getElementById('fullDate').textContent =
        `${dateActuelle.getDate()} ${MOIS[dateActuelle.getMonth()]} ${dateActuelle.getFullYear()}`;

      const textarea = document.getElementById('memory');
      textarea.value = chargerMemoire(key);
      document.getElementById('status').textContent = '';
      document.getElementById('status').classList.remove('saved');

      if (estAujourdhui(dateActuelle)) {
        document.getElementById('dayIndicator').textContent = "Aujourd'hui";
      } else {
        const auj = new Date();
        auj.setHours(0, 0, 0, 0);
        const diff = Math.round((dateActuelle - auj) / 86400000);
        if (diff === -1) document.getElementById('dayIndicator').textContent = "Hier";
        else if (diff === 1) document.getElementById('dayIndicator').textContent = "Demain";
        else if (diff < 0) document.getElementById('dayIndicator').textContent = `Il y a ${Math.abs(diff)} jours`;
        else document.getElementById('dayIndicator').textContent = `Dans ${diff} jours`;
      }

      textarea.oninput = () => {
        sauverMemoire(key, textarea.value);
        const status = document.getElementById('status');
        status.textContent = 'Enregistré ✓';
        status.classList.add('saved');
        clearTimeout(window._saveTimer);
        window._saveTimer = setTimeout(() => {
          status.textContent = '';
          status.classList.remove('saved');
        }, 1800);
      };
    }

    function changerJour(delta) {
      const nouvelle = new Date(dateActuelle);
      nouvelle.setDate(nouvelle.getDate() + delta);
      afficherJour(nouvelle);
    }

    function ouvrirJournal() {
      document.getElementById('cover').style.display = 'none';
      document.getElementById('overview').style.display = 'none';
      document.getElementById('souvenirs').style.display = 'none';
      document.getElementById('journal').style.display = 'block';
      const auj = new Date();
      auj.setHours(0, 0, 0, 0);
      afficherJour(auj);
    }

    function voirVueEnsemble() {
      document.getElementById('cover').style.display = 'none';
      document.getElementById('journal').style.display = 'none';
      document.getElementById('souvenirs').style.display = 'none';
      document.getElementById('overview').style.display = 'block';
      moisVue = new Date(dateActuelle.getFullYear(), dateActuelle.getMonth(), 1);
      construireGrille();
    }

    function voirSouvenirs() {
      document.getElementById('cover').style.display = 'none';
      document.getElementById('journal').style.display = 'none';
      document.getElementById('overview').style.display = 'none';
      document.getElementById('souvenirs').style.display = 'block';
      construireListeSouvenirs();
    }

    function retourCouverture() {
      document.getElementById('journal').style.display = 'none';
      document.getElementById('overview').style.display = 'none';
      document.getElementById('souvenirs').style.display = 'none';
      document.getElementById('cover').style.display = 'block';
    }

    function changerMois(delta) {
      moisVue.setMonth(moisVue.getMonth() + delta);
      construireGrille();
    }

    function construireGrille() {
      const annee = moisVue.getFullYear();
      const mois = moisVue.getMonth();
      const nbJours = new Date(annee, mois + 1, 0).getDate();

      document.getElementById('monthTitle').textContent =
        MOIS[mois].charAt(0).toUpperCase() + MOIS[mois].slice(1) + ' ' + annee;

      const grid = document.getElementById('daysGrid');
      grid.innerHTML = '';

      for (let d = 1; d <= nbJours; d++) {
        const date = new Date(annee, mois, d);
        const key = formatKey(date);
        const has = !!chargerMemoire(key);
        const isToday = estAujourdhui(date);

        const card = document.createElement('div');
        card.className = 'day-card' + (has ? ' has-memory' : '') + (isToday ? ' today' : '');
        card.innerHTML = `
          <div class="num">${d}</div>
          <div class="wd">${JOURS[date.getDay()].slice(0, 3)}</div>
        `;
        card.onclick = () => {
          document.getElementById('overview').style.display = 'none';
          document.getElementById('journal').style.display = 'block';
          afficherJour(date);
        };
        grid.appendChild(card);
      }
    }

    // Liste de tous les souvenirs (du plus récent au plus ancien)
    function construireListeSouvenirs() {
      const list = document.getElementById('entryList');
      list.innerHTML = '';

      const entries = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith('journal_')) {
          const dateStr = k.replace('journal_', '');
          const texte = localStorage.getItem(k);
          if (texte && texte.trim()) {
            entries.push({ key: dateStr, texte: texte.trim() });
          }
        }
      }

      // Trier du plus récent au plus ancien
      entries.sort((a, b) => b.key.localeCompare(a.key));

      if (entries.length === 0) {
        list.innerHTML = '<div class="empty-state">Aucun souvenir pour le moment.<br>Commence à écrire aujourd’hui…</div>';
        return;
      }

      entries.forEach(e => {
        const [y, m, d] = e.key.split('-').map(Number);
        const date = new Date(y, m - 1, d);
        const label = `${JOURS_CAP[date.getDay()]} ${d} ${MOIS[m - 1]} ${y}`;

        // Aperçu (max ~120 caractères)
        let preview = e.texte.replace(/\n+/g, ' ');
        if (preview.length > 140) preview = preview.slice(0, 140).trim() + '…';

        const card = document.createElement('div');
        card.className = 'entry-card';
        card.innerHTML = `
          <div class="entry-date">${label}</div>
          <div class="entry-preview">${preview}</div>
        `;
        card.onclick = () => {
          document.getElementById('souvenirs').style.display = 'none';
          document.getElementById('journal').style.display = 'block';
          afficherJour(date);
        };
        list.appendChild(card);
      });
    }
  </script>
</body>
</html>
